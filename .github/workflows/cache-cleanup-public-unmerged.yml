name: Cache Cleanup (public unmerged)

on:
  pull_request:
    types: [closed]

permissions:
  actions: read
  contents: read

concurrency:
  group: cache-cleanup-public-unmerged-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-scope:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Verify closed pull-request cache scope
        env:
          CACHE_REF: ${{ format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh cache list --ref "$CACHE_REF" --limit 1 --json id >/dev/null
