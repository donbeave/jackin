name: reuse-compliance (public unmerged)
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: reuse-compliance-public-unmerged-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reuse:
    name: REUSE (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: [{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          # step-level only: actionlint forbids runner.* in job env
          MISE_DATA_DIR: ${{ runner.temp }}/mise-data
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-cache
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-config
        with:
          version: "2026.7.12"
          install_args: python uv pipx:reuse
          cache_save: false
          github_token: ${{ github.token }}
      - name: REUSE Compliance Check
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-data
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-cache
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-config
        run: reuse lint

